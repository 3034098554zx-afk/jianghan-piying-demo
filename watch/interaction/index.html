<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="江汉皮影数字交互作品 · 高清评审演示">
<link rel="icon" href="data:,">
<title>江汉皮影 · 交互演示</title>
<style>
:root{color-scheme:light;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:#47342b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:18px max(12px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
main{width:min(100%,960px);display:grid;gap:12px;justify-items:center;text-align:center}
header p{font:600 12px/1.25 system-ui;color:#8f392b;margin:0 0 4px;letter-spacing:.16em}
h1{font:650 clamp(20px,5vw,28px)/1.25 "Songti SC",SimSun,serif;margin:0}
.player{position:relative;width:100%;overflow:hidden;border-radius:14px;border:1px solid #e9ded6;box-shadow:0 9px 28px #704e3411;background:#fff}
video{display:block;width:100%;aspect-ratio:1440/914;height:auto;max-height:min(71vh,650px);max-height:min(71svh,650px);object-fit:contain;background:#fff}
button{border:1px solid #dfcdc1;border-radius:999px;padding:9px 18px;min-height:44px;background:#fff;color:#694331;font:600 14px/1.3 system-ui;cursor:pointer}
button:focus-visible{outline:2px solid #a56745;outline-offset:3px}
#start{position:absolute;z-index:1;left:50%;top:52%;transform:translate(-50%,-50%);background:#873b2c;color:white;border-color:#873b2c;box-shadow:0 4px 18px #2c100536;white-space:nowrap}
#start[hidden]{display:none}
.quality{display:flex;gap:8px;justify-content:center}
.quality button[aria-pressed=true]{background:#f6e8db;border-color:#c58e6e;color:#7c3223}
.status{margin:0;min-height:2.8em;font-size:12px;line-height:1.4;color:#6a5548}
@media (orientation:landscape) and (max-height:500px){body{padding-block:8px}main{gap:8px}video{max-height:calc(100vh - 124px);max-height:calc(100svh - 124px)}header p{display:none}}
</style>
</head>
<body>
<main>
<header><p>江汉皮影</p><h1>交互演示</h1></header>
<div class="player">
<video id="film" src="review-hd.mp4" poster="review-cover.webp" width="1440" height="914" controls playsinline webkit-playsinline preload="metadata" aria-label="江汉皮影交互演示视频"></video>
<button id="start" type="button" hidden>▶ 播放演示</button>
</div>
<div class="quality" role="group" aria-label="播放画质">
<button type="button" data-video="review-hd.mp4" aria-pressed="true">高清</button>
<button type="button" data-video="review-lite.mp4" aria-pressed="false">流畅</button>
</div>
<p id="status" class="status" role="status">默认高清，点播放开启声音。横屏全屏更易看清手机界面。</p>
<noscript><a href="review-lite.mp4">网络较慢？打开流畅版</a></noscript>
</main>
<script>
const film = document.getElementById('film');
const start = document.getElementById('start');
const status = document.getElementById('status');
const options = document.querySelectorAll('[data-video]');
let delay;
let played = false;
let changing = false;
const idleCopy = '默认高清，点播放开启声音。横屏全屏更易看清手机界面。';
const playingCopy = '可横屏全屏观看。网慢时可手动切换「流畅」。';
function waiting() {
  clearTimeout(delay);
  delay = setTimeout(() => {
    status.textContent = '正在缓冲。网慢时可切换「流畅」。';
  }, 1700);
}
function play() {
  start.hidden = true;
  film.play().catch(() => {
    if (changing) return;
    clearTimeout(delay);
    start.textContent = '▶ 再试一次';
    start.hidden = false;
    status.textContent = '视频尚未播放，可重试或切换「流畅」。';
  });
  waiting();
}
start.hidden = false;
start.addEventListener('click', () => {
  if (film.error) film.load();
  play();
});
film.addEventListener('play', () => { start.hidden = true; });
film.addEventListener('playing', () => {
  clearTimeout(delay);
  played = true;
  changing = false;
  start.hidden = true;
  status.textContent = playingCopy;
});
film.addEventListener('waiting', () => { if (!film.paused) waiting(); });
film.addEventListener('pause', () => { clearTimeout(delay); });
film.addEventListener('ended', () => {
  start.textContent = '↻ 重播';
  start.hidden = false;
});
film.addEventListener('error', () => {
  clearTimeout(delay);
  changing = false;
  status.textContent = '没有载入视频。可以重试、切到「流畅」，或在手机浏览器打开。';
  start.textContent = '▶ 重试播放';
  start.hidden = false;
});
for (const option of options) option.addEventListener('click', () => {
  if (option.getAttribute('aria-pressed') === 'true') return;
  const resumeAt = film.ended ? 0 : film.currentTime;
  const resume = !film.paused;
  changing = true;
  clearTimeout(delay);
  film.onloadedmetadata = () => {
    if (resumeAt > 0 && resumeAt < film.duration) film.currentTime = resumeAt;
    changing = false;
    film.onloadedmetadata = null;
  };
  film.src = option.dataset.video;
  for (const item of options) item.setAttribute('aria-pressed', String(item === option));
  status.textContent = played ? playingCopy : option.dataset.video.includes('lite') ? '已切到流畅版。点播放开启声音。' : idleCopy;
  if (resume) play();
  else {
    start.textContent = resumeAt > 0 ? '▶ 继续播放' : '▶ 播放演示';
    start.hidden = false;
  }
});
</script>
</body>
</html>
