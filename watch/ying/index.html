<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c110d">
<link rel="icon" href="data:,">
<title>「影」动态海报 · 江汉皮影</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#fff1dc;background:#1c110d}
body{box-sizing:border-box;min-height:100vh;min-height:100svh;margin:0;padding:16px 14px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#40241a,#1c110d 72%)}
main{width:min(100%,540px);display:grid;justify-items:center;gap:10px;text-align:center}
header p{margin:0 0 3px;color:#e6bb8e;font-size:12px;letter-spacing:.25em}
h1{margin:0;font-family:"Songti SC",SimSun,serif;font-size:clamp(20px,5.5vw,30px);font-weight:600}
video{display:block;width:100%;height:auto;aspect-ratio:1080/1528;max-height:calc(100vh - 180px);max-height:calc(100svh - 180px);object-fit:contain;background:#120b08;border-radius:12px;outline:1px solid #ce986b55;box-shadow:0 12px 39px #0007}
.quality{display:flex;gap:8px}
.quality button{min-height:36px;padding:0 16px;border:1px solid #a6795566;border-radius:999px;background:#2c1b14;color:#e5c7ac;font:inherit;font-size:13px;cursor:pointer}
.quality button[aria-pressed="true"]{background:#e6bb8e;border-color:#e6bb8e;color:#302019}
.quality button:focus-visible{outline:2px solid #fff1dc;outline-offset:3px}
.hint{margin:0;color:#e5c7ac;font-size:12px;line-height:1.55}
a{color:inherit}
</style>
</head>
<body>
<main>
<header><p>江汉皮影</p><h1>「影」动态海报</h1></header>
<video src="poster-hd.mp4" poster="cover-hd.webp" width="1080" height="1528" aria-label="影字动态海报" controls autoplay muted playsinline preload="auto"></video>
<div class="quality" role="group" aria-label="播放画质">
<button type="button" data-src="poster-hd.mp4" aria-pressed="true">高清</button>
<button type="button" data-src="poster.mp4" aria-pressed="false">流畅</button>
</div>
<p class="hint" id="hint">若未自动播放，请点播放；网络慢可切换「流畅」。</p>
<p class="hint" id="retry" role="status" hidden>视频未能载入，请 <a href="./">重试</a> 或切换「流畅」。</p>
</main>
<script>
const player = document.querySelector('video');
const qualityButtons = document.querySelectorAll('.quality button');
const hint = document.getElementById('hint');
const retry = document.getElementById('retry');
function setErrorState(failed) {
  hint.hidden = failed;
  retry.hidden = !failed;
}
player.addEventListener('error', () => setErrorState(true));
if (player.error) setErrorState(true);
retry.querySelector('a').addEventListener('click', event => {
  event.preventDefault();
  setErrorState(false);
  player.load();
  player.play().catch(() => {});
});
for (const button of qualityButtons) {
  button.addEventListener('click', () => {
    if (button.getAttribute('aria-pressed') === 'true') return;
    const resumeAt = player.ended ? 0 : player.currentTime;
    const shouldPlay = !player.paused || resumeAt === 0 || player.error;
    player.autoplay = false;
    player.onloadedmetadata = () => {
      if (resumeAt > 0 && resumeAt < player.duration) player.currentTime = resumeAt;
      player.onloadedmetadata = null;
    };
    player.src = button.dataset.src;
    for (const option of qualityButtons) option.setAttribute('aria-pressed', option === button);
    setErrorState(false);
    if (shouldPlay) player.play().catch(() => {});
  });
}
</script>
</body>
</html>
