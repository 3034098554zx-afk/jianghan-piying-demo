 if (next==='perform' && stage==='assemble' && (draft.mobilePlaced||[]).length!==glyph.parts.length) return false;
 setStage(next);
 return true;
}

function mobileSaveWork() {
 return stage==='perform'&&!mobileStandalone&&save(true)===true;
}

function mobileColorPart(q) {
 if (stage!=='color' || !displayMatrices) return;
 const world=[(q.x-fit.x)/fit.s,(q.y-fit.y)/fit.s];
 for (const id of [...glyph.order].reverse()) {
  const p=parts.get(id),m=displayMatrices[id];
  if (!m || p.preserveColor || p.fixedMaterial) continue;
  const at=inverse(m,world),x=Math.floor(at[0]),y=Math.floor(at[1]);
  if (x<0||y<0||x>=p.width||y>=p.height) continue;
  if (material(p).getContext('2d').getImageData(x,y,1,1).data[3]>65) return p;
 }
}

function mobileColorPoint(q) {
 const p=parts.get(selected),m=displayMatrices[selected];
 if (!m) return local(q);
 const at=inverse(m,[(q.x-fit.x)/fit.s,(q.y-fit.y)/fit.s]);
 return {x:at[0],y:at[1]};
}

function mobileZoom(delta) {
 zoom=clamp(zoom+delta,.75,1.75);
 schedule();
}

function mobileStageFit(bounds) {
 const s=Math.min(width*.70/bounds.w,height*.76/bounds.h)*stageMobile.scale;
 const cx=width*(.5+stageMobile.x),cy=height*(.54+stageMobile.y);
 const box={w:bounds.w*s,h:bounds.h*s,cx,cy};
 return {s,cx,cy,box,x:cx-(bounds.x+bounds.w/2)*s,y:cy-(bounds.y+bounds.h/2)*s};
}

function mobileActorPose() {
 return stageMobile.actor==='mine'?draft.pose:theatre.originalPose;
}

function mobileJointAngle(id) {
 return (mobileActorPose()[id]||0)+(theatre.springs[stageMobile.actor][id]?.value||0);
}

function mobileHoldJoint(id,angle) {
 const limit=PuppetMotion.limits[id]||55;
 const offset=clamp(angle,-limit,limit)-(mobileActorPose()[id]||0);
 const spring=theatreSpring(stageMobile.actor,id);
 spring.target=spring.value=offset;
 spring.velocity=0;
}

function mobileReleaseJoint(id,velocity=0) {
 const spring=theatre.springs[stageMobile.actor][id];
 if (!spring) return;
 spring.target=0;
 spring.velocity=reduced.matches?0:clamp(velocity,-110,110);
 if(reduced.matches) spring.value=0;
}

function mobileStageSnapshot() {
 const {x,y,scale,angle,rodMatrix,joint,foreground,backdrop,template}=stageMobile;
 return {x,y,scale,angle,rodMatrix:rodMatrix.slice(),joint,foreground,backdrop,template,pose:{...mobileActorPose()}};
}

function mobileRemember(snapshot=mobileStageSnapshot()) {
 stageMobile.undo.push(snapshot);
 if (stageMobile.undo.length>28) stageMobile.undo.shift();
}

function mobileNotifyStage() {
 schedule();
 document.dispatchEvent(new Event('mobile-stage-change'));
}

function mobileRestore(snapshot) {
 const {pose,...view}=snapshot;
 mobileGrips.clear();
 Object.assign(stageMobile,view);
 if (stageMobile.actor==='mine') draft.pose={...pose};
 else theatre.originalPose={...pose};
 theatre.handles={mine:{},original:{}};
 theatre.springs={mine:{},original:{}};
 if (stageMobile.actor==='mine') save();
 mobileNotifyStage();
}

function mobileResetStage() {
 mobileRemember();
 playing=false;playTime=0;
 mobileRestore({x:0,y:0,scale:1,angle:0,rodMatrix:identity,joint:null,foreground:null,backdrop:stageMobile.backdrop,template:null,pose:{}});
}

const stageActorLoads=new Map();
function mobilePrepareStageActor(id) {
 if(id==='mine'||theatre.originals.has(id))return Promise.resolve();
 if(!stageActorLoads.has(id)){
  stageActorLoads.set(id,initTheatre([id]).finally(()=>stageActorLoads.delete(id)));
 }
 return stageActorLoads.get(id);
}

function mobileSelectStageActor(id) {
 if (id==='mine' && mobileStandalone&&mobileParams.get('work')!=='1') return;
 if (id!=='mine' && !theatre.originals.has(id)) return;
 if (id==='mine') stageMobile.actor='mine';
 else {
  const original=theatre.originals.get(id);
  stageMobile.actor='original';
  stageMobile.original=id;
  theatre.reference=original.ref;
  theatre.original=original.parts;
  theatre.thumb=original.thumb;
  theatre.originalPose={};
 }
 theatre.duet=false;theatre.mix=1;theatre.linked=false;theatre.active=stageMobile.actor;
 theatre.handles={mine:{},original:{}};
 theatre.springs={mine:{},original:{}};
 mobileGrips.clear();
 stageMobile.x=0;stageMobile.y=0;stageMobile.scale=1;stageMobile.angle=0;stageMobile.rodMatrix=identity;
 stageMobile.joint=null;stageMobile.foreground=null;stageMobile.template=null;stageMobile.undo=[];
 playing=false;playTime=0;sceneSync();mobileNotifyStage();
}

const mobileGrips=new Map();
const rodSlopeLimit=Math.tan(12*Math.PI/180);

const mobileBeats=[
 {time:0,x:0,y:0,angle:0,scale:1},
 {time:.17,x:-.052,y:.017,angle:-10,scale:.97},
 {time:.41,x:.10,y:-.074,angle:18,scale:1.01},
 {time:.64,x:.077,y:-.022,angle:-16,scale:.89},
 {time:1.22,x:-.10,y:-.084,angle:360,scale:.87},
 {time:1.46,x:.044,y:-.013,angle:378,scale:.98},
 {time:1.70,x:-.024,y:.015,angle:351,scale:1},
 {time:1.93,x:.010,y:-.006,angle:364,scale:.995},
 {time:2.30,x:0,y:0,angle:360,scale:1}
];
const mobilePerformanceSeconds=mobileBeats.at(-1).time;

function mobileSwingBody(dx,dy,turn,spread) {
 if (reduced.matches) return;
 const x=dx/width,y=dy/height,twist=turn/Math.PI;
 const kicks={
  body:1520*x+570*y-300*twist+390*spread,
  green:-690*x+260*y+250*twist,
  yellow:570*x-480*y+150*twist,
  left:-1230*x-630*y+375*twist-890*spread,
  right:1060*x+630*y+360*twist+810*spread,
  legRed:1610*x+730*y+330*twist,
  legBlue:1150*x-720*y+455*twist-530*spread,
  tail:-1390*x+600*y+420*twist
 };
 const actor=stageMobile.actor;
 for (const {id} of theatre.actors[actor]?.frames||[]) {
  const kick=kicks[id]||0;
  if (Math.abs(kick)<1) continue;
  const spring=theatreSpring(actor,id);
  const limit=(PuppetMotion.limits[id]||45)*.86;
  if(spring.target!==0) continue;
  spring.value=clamp(spring.value+kick*.018,-limit,limit);
  spring.velocity=clamp(spring.velocity+kick,-limit*15,limit*15);
 }
}

function mobileRodLinks(actor) {
 const {frames}=actor;
 const main=(actor.actor==='mine'?glyph.rods:theatre.reference.controlAttachments)||[];
 // The embedded shaft in the Ying artwork supplies the right-hand connection.
 const tail=frames.find(frame=>frame.p.foregroundAttachment&&frame.p.holes.some(h=>h.id==='tailEnd'));
 const links=tail?[main[1]||main[0],{partId:tail.id,driver:tail.id,holeId:'tailEnd'}]:main.slice(0,2);
 return links.flatMap((link,slot)=>{
  const part=frames.find(frame=>frame.id===link?.partId),hole=part?.p.holes.find(h=>h.id===link?.holeId);
  return hole?[{slot,id:link.driver||link.partId,part,pin:[hole.x,hole.y]}]:[];
 });
}

function mobileControlRods(links) {
 const grips=[...mobileGrips.values()];
 return links.map(({slot,id,part,pin})=>{
  const start=point(part.screen,pin);
  const [x,y]=start;
  const hand=grips.find(grip=>grip.slot===slot);
  const [a,b]=part.screen,[c,d]=part.p.transform;
  const rotation=Math.atan2(b,a)-Math.atan2(d,c);
  const restingSlope=(slot?.085:-.085)+.09*Math.sin(rotation);
  const desiredSlope=hand?(hand.at[0]+hand.offset[0]-x)/Math.max(24,hand.at[1]+hand.offset[1]-y):restingSlope;
  let slope=clamp(desiredSlope,-rodSlopeLimit,rodSlopeLimit);
  if (y<height && x>=3 && x<=width-3) {
   const depth=height-y;
   slope=clamp(slope,(3-x)/depth,(width-3-x)/depth);
  }
  const onShaft=level=>[x+slope*(level-y),level];
  // Keep the shaft in stage coordinates. Rotate the puppet before attaching the rod.
  const end=onShaft(Math.max(height,y)+48);
  const targetGrip=hand?hand.at[1]+hand.offset[1]:height*.87;
  const grip=onShaft(clamp(targetGrip,Math.min(y+16,height-9),height-9));
  return {slot,id,partId:part.id,pin,start,end,grip,size:width<570?2.3:3};
 });
}

function mobilePerformanceTransform(fit) {
 if (!playing||reduced.matches) return identity;
 const next=Math.max(1,mobileBeats.findIndex(beat=>beat.time>=playTime));
 const from=mobileBeats[next-1],to=mobileBeats[next];
 const t=clamp((playTime-from.time)/(to.time-from.time),0,1),ease=t*t*(3-2*t);
 const value=key=>from[key]+(to[key]-from[key])*ease;
 const angle=value('angle'),x=fit.cx,y=fit.cy;
 const zoom=value('scale')-.09*Math.sin(t*Math.PI)*Number(to.angle-from.angle>300);
 const stretch=[zoom,0,0,zoom,x*(1-zoom),y*(1-zoom)];
 return mul(trans(width*value('x'),height*value('y')),mul(rot(angle,[x,y]),stretch));
}

function mobileKeepPinsInView(matrix,pins) {
 if (!pins.length||width<=16||height<=34) return matrix;
 const points=pins.map(pin=>point(matrix,pin));
 const xs=points.map(at=>at[0]),ys=points.map(at=>at[1]);
 const left=Math.min(...xs),right=Math.max(...xs),top=Math.min(...ys),bottom=Math.max(...ys);
 const roomX=width-16,roomY=height-34;
 const scale=Math.min(1,roomX/Math.max(right-left,1),roomY/Math.max(bottom-top,1));
 const x=(left+right)/2,y=(top+bottom)/2,halfX=(right-left)*scale/2,halfY=(bottom-top)*scale/2;
 const dx=clamp(x,8+halfX,width-8-halfX)-x,dy=clamp(y,8+halfY,height-26-halfY)-y;
 if (scale===1&&dx===0&&dy===0) return matrix;
 return mul([scale,0,0,scale,x*(1-scale)+dx,y*(1-scale)+dy],matrix);
}

function mobileDriveActor(actor) {
 const links=mobileRodLinks(actor);
 actor.rodPins=links.map(({part,pin})=>point(part.screen,pin));
 const motion=mul(stageMobile.rodMatrix,mobilePerformanceTransform(actor.fit));
 const matrix=mobileKeepPinsInView(motion,actor.rodPins);
 actor.drive=matrix;
 for (const frame of actor.frames) frame.screen=mul(matrix,frame.screen);
 actor.rods=mobileControlRods(links);
 return actor;
}

function mobilePausePerformance() {
 if (!playing) return;
 const drive=theatre.actors[stageMobile.actor]?.drive;
 if (drive) stageMobile.rodMatrix=drive.slice();
 freezeSceneMotion();
}

function mobileFreeRods(actor) {
 const held=new Set([...mobileGrips.values()].map(grip=>grip.slot));
 return (actor?.rods||[]).filter(rod=>!held.has(rod.slot));
}

function mobileGrabRod(key,at,slot) {
 if (mobileGrips.has(key)) return mobileGrips.get(key).slot;
 if (!at.every(Number.isFinite)) return null;
 const free=mobileFreeRods(theatre.actors[stageMobile.actor]);
 const [pick]=slot===undefined
  ?free.sort((a,b)=>Math.hypot(a.grip[0]-at[0],a.grip[1]-at[1])-Math.hypot(b.grip[0]-at[0],b.grip[1]-at[1]))
  :free.filter(rod=>rod.slot===slot);
 if (!pick) return null;
 const [x,y]=pick.start;
 const holdY=slot===undefined?pick.grip[1]:clamp(at[1],Math.min(y+16,height-9),height-9);
 const holdX=x+(pick.end[0]-x)*(holdY-y)/(pick.end[1]-y);
 if (!mobileGrips.size) {mobilePausePerformance();mobileRemember();}
 stageMobile.mode='joint';stageMobile.joint=pick.id;
 mobileGrips.set(key,{slot:pick.slot,at:at.slice(),offset:[holdX-at[0],holdY-at[1]]});
 mobileNotifyStage();
 return pick.slot;
}

function mobilePullRods(points) {
 const actor=theatre.actors[stageMobile.actor],grips=[...mobileGrips.values()];
 if(!actor||!grips.length) return;
 const from=grips.map(grip=>grip.at);
 for(const {key,at} of points){
  const grip=mobileGrips.get(key);
  if(grip&&at.every(Number.isFinite)) grip.at=at;
 }
 const to=grips.map(grip=>grip.at);
 const dx=to.reduce((sum,at,i)=>sum+at[0]-from[i][0],0)/grips.length;
 const dy=to.reduce((sum,at,i)=>sum+at[1]-from[i][1],0)/grips.length;
 const drive=mobileKeepPinsInView(stageMobile.rodMatrix,actor.rodPins);
 let turn=0,scale=1,spread=0;
 if(grips.length===2){
  const ax=from[1][0]-from[0][0],ay=from[1][1]-from[0][1];
  const bx=to[1][0]-to[0][0],by=to[1][1]-to[0][1];
  const previous=Math.hypot(ax,ay),current=Math.hypot(bx,by);
  spread=(current-previous)/width;
  if(Math.min(previous,current)>16){
   turn=Math.atan2(ax*by-ay*bx,ax*bx+ay*by);
   const zoom=Math.hypot(drive[0],drive[1]);
   scale=clamp(current/previous,Math.min(1,.60/zoom),Math.max(1,1.75/zoom));
  }
 }
 if(dx===0&&dy===0&&turn===0&&spread===0) return;
 const [x,y]=point(drive,[actor.fit.cx,actor.fit.cy]);
 const a=Math.cos(turn)*scale,b=Math.sin(turn)*scale;
 const update=[a,b,-b,a,dx+x-a*x+b*y,dy+y-b*x-a*y];
 stageMobile.rodMatrix=mobileKeepPinsInView(mul(update,drive),actor.rodPins);
 mobileSwingBody(dx,dy,turn,spread);
 mobileNotifyStage();
}

function mobileDropRod(key) {
 if (mobileGrips.delete(key)) mobileNotifyStage();
}

function mobileIsGripping(key){return mobileGrips.has(key);}

function mobileRodMarks(actor) {
 if (stageMobile.mode!=='joint'||playing) return;
 ctx.save();
 for (const rod of actor.rods) {
  if (rod.grip[1]<=rod.start[1]+4) continue;
  const held=[...mobileGrips.values()].some(g=>g.slot===rod.slot);
  ctx.beginPath();ctx.arc(...rod.grip,held?6.1:3.1,0,Math.PI*2);
  ctx.strokeStyle=held?'#fff1c8':'#f6d59e';
  ctx.shadowBlur=held?9:0;ctx.shadowColor='#ffc97b';
  ctx.lineWidth=held?2:1;ctx.stroke();
 }
 ctx.restore();
}

function mobileJoints(actor) {
 return actor?.frames.flatMap(frame=>{
  const anchor=actor.actor==='mine'?frame.p.pivot:frame.p.anchor;
  const hole=anchor && frame.p.holes.find(h=>h.id===anchor);
  return hole?[{id:frame.id,label:frame.p.label,at:point(frame.screen,[hole.x,hole.y])}]:[];
 })||[];
}

function mobileSharedJoints(joints,joint) {
 return joint?joints.filter(({at})=>Math.hypot(at[0]-joint.at[0],at[1]-joint.at[1])<2):[];
}

function mobileJointMarks(actor) {
 if (stageMobile.mode!=='joint'||playing) return;
 const joints=mobileJoints(actor);
 const selectedJoint=joints.find(joint=>joint.id===stageMobile.joint);
 ctx.save();
 const inactive=joints.filter(joint=>joint.id!==stageMobile.joint);
 for (const joint of selectedJoint?[...inactive,selectedJoint]:inactive) {
  const active=joint.id===stageMobile.joint;
  ctx.beginPath();ctx.arc(...joint.at,active?6.6:4.7,0,Math.PI*2);
  ctx.fillStyle=active?'#9e341daa':'#ffd89185';ctx.strokeStyle='#fff6d7';
  ctx.lineWidth=active?1.8:1;ctx.fill();ctx.stroke();
 }
 ctx.restore();
}

function mobileStageRead() {
 const actor=theatre.actors[stageMobile.actor];
 const markers=mobileJoints(actor);
 const joint=markers.find(marker=>marker.id===stageMobile.joint);
 const angleLimit=stageMobile.mode==='joint'?(PuppetMotion.limits[joint?.id||markers[0]?.id]||55):180;
 const rods=actor?.rods||[];
 return {...mobileStageSnapshot(),actor:stageMobile.actor,original:stageMobile.original,mode:stageMobile.mode,
  playing,duration:mobilePerformanceSeconds,canUndo:stageMobile.undo.length>0,markers,angleLimit,jointLabel:joint?.label,
  sharedJoint:mobileSharedJoints(markers,joint).length>1,rods,width,height,drive:actor?.drive||identity,heldRods:[...mobileGrips.values()].map(g=>g.slot),
  amount:Math.round(stageMobile.mode==='joint'?mobileJointAngle(stageMobile.joint):((stageMobile.angle%360+540)%360)-180)};
}

function mobileSceneDown(event,q) {
 if (event.pointerType==='mouse'&&event.button!==0) return;
 const actor=theatre.actors[stageMobile.actor];
 if (!actor) return;
 if (stageMobile.mode==='joint') {
  const at=[q.x,q.y];
  const nearJoint=mobileJoints(actor).some(j=>Math.hypot(q.x-j.at[0],q.y-j.at[1])<13);
  const [hit]=mobileFreeRods(actor).map(rod=>({
   rod,
   distance:nearJoint?Math.hypot(q.x-rod.grip[0],q.y-rod.grip[1]):PuppetMotion.distance(at,rod)
  })).sort((a,b)=>a.distance-b.distance);
  if (hit&&hit.distance<(nearJoint?13:16)&&mobileGrabRod(event.pointerId,at,hit.rod.slot)!==null) {
   event.preventDefault();canvas.setPointerCapture(event.pointerId);return;
  }
 }
 if (!event.isPrimary||stageMobile.gesture||mobileGrips.size) return;
 if (playing&&stageMobile.mode!=='joint') mobilePausePerformance();
 if (stageMobile.mode==='layer') {
  const hit=sceneHit(q);
  if (hit?.frame) {
   mobileRemember();stageMobile.foreground=stageMobile.foreground===hit.frame.id?null:hit.frame.id;
   toast(stageMobile.foreground?'已将部件移到最前':'已恢复部件层次');mobileNotifyStage();
  }
  return;
 }
 const gesture={pointer:event.pointerId,mode:stageMobile.mode,startX:q.x,startY:q.y,origin:mobileStageSnapshot()};
 if (gesture.mode==='joint') {
  const hit=sceneHit(q);
  const joints=mobileJoints(actor);
  const [nearest]=joints.map(j=>({...j,d:Math.hypot(q.x-j.at[0],q.y-j.at[1])})).sort((a,b)=>a.d-b.d);
  const driver=hit?.frame?.p.dragDriver||hit?.frame?.id;
  const shared=nearest?.d<17?mobileSharedJoints(joints,nearest):[];
  const joint=shared.find(j=>j.id===stageMobile.joint)||shared.find(j=>j.id===driver)||
   shared.at(-1)||joints.find(j=>j.id===driver);
  if (!joint) return;
  stageMobile.joint=joint.id;
  gesture.joint=joint;
  gesture.shared=shared.map(j=>j.id);
  gesture.pivot=joint.at;
  gesture.linear=Math.hypot(q.x-joint.at[0],q.y-joint.at[1])<21;
  gesture.startAngle=Math.atan2(q.y-gesture.pivot[1],q.x-gesture.pivot[0]);
  gesture.angle=mobileJointAngle(joint.id);
  gesture.lastAngle=gesture.angle;
  gesture.lastMove=performance.now();
  gesture.velocity=0;
  mobileHoldJoint(joint.id,gesture.angle);
 }
 event.preventDefault();
 if (gesture.mode!=='joint') mobileRemember();
 stageMobile.gesture=gesture;
 canvas.setPointerCapture(event.pointerId);
 mobileNotifyStage();
}

function mobileSceneMove(event,q) {
 if (mobileIsGripping(event.pointerId)) {mobilePullRods([{key:event.pointerId,at:[q.x,q.y]}]);return;}
 const g=stageMobile.gesture;
 if (!g || g.pointer!==event.pointerId) return;
 const dx=q.x-g.startX,dy=q.y-g.startY;
 g.moved ||= Math.hypot(dx,dy)>4;
 if (g.mode==='move') {
  stageMobile.x=clamp(g.origin.x+dx/width,-.37,.37);stageMobile.y=clamp(g.origin.y+dy/height,-.32,.31);
 } else if (g.mode==='scale') stageMobile.scale=clamp(g.origin.scale-dy/height*1.75,.58,1.65);
 else if (g.mode==='turn') stageMobile.angle=g.origin.angle+dx*1.8;
 else if (g.mode==='joint') {
  let rad=Math.atan2(q.y-g.pivot[1],q.x-g.pivot[0])-g.startAngle;
  rad=Math.atan2(Math.sin(rad),Math.cos(rad));
  const limit=PuppetMotion.limits[g.joint.id]||55;
  const angle=clamp(g.angle+(g.linear?dx*.94-dy*.38:rad*180/Math.PI),-limit,limit);
  if (!g.changed&&Math.abs(angle-g.angle)>.5) {
   mobileRemember(g.origin);
   g.changed=true;
  }
  const now=performance.now();
  g.velocity=clamp((angle-g.lastAngle)/Math.max(.008,(now-g.lastMove)/1000),-160,160);
  g.lastAngle=angle;g.lastMove=now;
  mobileHoldJoint(g.joint.id,angle);
 }
 mobileNotifyStage();
}

function mobileSceneEnd(event,cancel=false) {
 if (mobileIsGripping(event.pointerId)) {mobileDropRod(event.pointerId);return;}
 const g=stageMobile.gesture;
 if (!g || event.pointerId!==g.pointer) return;
 stageMobile.gesture=null;
 if (g.mode==='joint'&&cancel&&g.changed) {
  stageMobile.undo.pop();
  mobileRestore(g.origin);
 } else if (g.mode==='joint') {
  mobileReleaseJoint(g.joint.id,!cancel&&performance.now()-g.lastMove<100?g.velocity*.55:0);
  if (!cancel&&!g.moved&&g.shared.length>1&&g.origin.joint===g.joint.id) {
   stageMobile.joint=g.shared[(g.shared.indexOf(g.joint.id)+1)%g.shared.length];
  }
 } else if (cancel) {
  stageMobile.undo.pop();
  mobileRestore(g.origin);
 } else if (stageMobile.actor==='mine') save(true);
 mobileNotifyStage();
}

function mobileStageAction(action,value) {
 if (action==='setup') {
  stageMobile.mode='joint';stageMobile.backdrop='amber';
  mobileSelectStageActor(mobileStandalone&&mobileParams.get('work')!=='1'?stageMobile.original:'mine');
  theatre.ambient=false;
 } else if (action==='actor') mobileSelectStageActor(value);
 else if (action==='mode') {stageMobile.mode=value;mobileNotifyStage();}
 else if (action==='undo') {
  const last=stageMobile.undo.pop();
  if (last) mobileRestore(last);
 } else if (action==='reset') mobileResetStage();
 else if (action==='backdrop') {
  if (['amber','paper','night'].includes(value)) {mobileRemember();stageMobile.backdrop=value;mobileNotifyStage();}
 } else if (action==='hold') {
  mobileRemember();
 } else if (action==='release') {
  if (stageMobile.mode==='joint') mobileReleaseJoint(stageMobile.joint);
  mobileNotifyStage();
 }
 else if (action==='angle') {
  if (stageMobile.mode==='joint') {
   const joint=stageMobile.joint||mobileJoints(theatre.actors[stageMobile.actor])[0]?.id;
   if (joint) {
    stageMobile.joint=joint;
    mobileHoldJoint(joint,Number(value));
   }
  } else if (stageMobile.mode==='turn') stageMobile.angle=clamp(Number(value),-180,180);
  mobileNotifyStage();
 } else if (action==='template') {
  mobileRemember();playing=false;playTime=0;
  stageMobile.template=String(value);
  const pose=mobileActorPose(), joints=mobileJoints(theatre.actors[stageMobile.actor]);
  for (const [i,joint] of joints.entries()) {
   const sign=i%2?1:-1,limit=PuppetMotion.limits[joint.id]||55;
   pose[joint.id]=clamp(sign*(Number(value)+1)*(11+i%3*5),-limit,limit);
  }
  stageMobile.angle=(Number(value)-1)*6;
  theatre.handles={mine:{},original:{}};
  theatre.springs={mine:{},original:{}};
