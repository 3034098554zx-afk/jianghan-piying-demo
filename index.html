@font-face {
  font-family: "Jianghan Shop";
  src: url("assets/jianghan-shop.woff2") format("woff2");
  font-style: normal;
  font-weight: 200 900;
  font-display: swap;
}

.app.is-shop {
  --serif: "Jianghan Shop", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
}

.app.is-home, .startup-message {
  --serif: "Jianghan Opening", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
}

*, *::before, *::after {box-sizing: border-box}
html, body {height: 100%; overflow: hidden}
body {margin: 0; background: #e6d8c5; color: var(--ink); font: 14px/1.55 var(--sans)}
button {font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent}
button, summary {transition: background-color .18s, color .18s, scale .22s cubic-bezier(.2,.8,.25,1)}
button:active:not(:disabled) {scale: .957; transition-duration: .09s}
button:disabled {cursor: default}
:where(button, video, input):focus-visible {outline: 2px solid #9a4e34; outline-offset: 3px}
h1, h2, p {margin: 0}
h1, h2 {font-family: var(--serif); font-weight: 650}
svg {width: 22px; height: 22px; vertical-align: middle; flex: none}
img {max-width: 100%}
[hidden] {display: none !important}

.app {
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100vh;
  height: 100dvh;
  width: 100%;
  margin-inline: auto;
  overflow: hidden;
  background: radial-gradient(ellipse at 96% 72%, #eddec9 0%, transparent 65%), var(--paper);
}
@media (min-width: 600px) {
  body {display: grid; place-items: center; background: radial-gradient(ellipse at 46% 28%, #f8eddd, #ddccb8 110%)}
  .app {width: min(442px, 100%); height: min(900px, 100dvh - 32px); border-radius: 30px; box-shadow: 0 18px 70px #57352028, 0 0 0 1px #fff9efc2}
}
.view {position: relative; grid-row: 2; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: none}
#view-content {display: contents}
.view::-webkit-scrollbar, .category-tabs::-webkit-scrollbar {display: none}
.is-home .view {grid-row: 1 / 3}
.in-experience .view {overflow: hidden}
.topbar {
  position: relative;
  z-index: 5;
  grid-row: 1;
  display: grid;
  grid-template-columns: 44px minmax(0,1fr) 44px;
  align-items: center;
  min-height: calc(53px + var(--safe-top));
  padding: var(--safe-top) 12px 0;
  color: var(--ink);
  border-bottom: 1px solid #b8875d22;
  background: #f8eedfcf;
}
.is-home .topbar {
  position: absolute;
  inset: 0 0 auto;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  padding: calc(var(--safe-top) + 18px) var(--gutter) 8px;
  transition: background-color .2s, border-color .2s;
  background: transparent;
  border-color: transparent;
}
.is-home.home-scrolled .topbar {background: #f8eedff0; backdrop-filter: blur(16px); border-color: #b8875d22}
.brand-button {display: inline-flex; align-items: center; gap: 7px; text-align: left; min-height: 47px; min-width: 0}
.brand-button .brand-mark {width: clamp(34px, 10vw, 46px); height: auto; align-self: center}
.brand-button strong {font: 650 clamp(19px, 5.6vw, 26px)/1.12 var(--serif); white-space: nowrap}
.brand-button small {display: block; margin-top: 4px; font: 500 clamp(8px, 2.57vw, 11px)/1.4 var(--serif); white-space: nowrap; color: #594031; letter-spacing: .018em}
.home-tools {position: relative; flex: none}
.tool-capsule {display: flex; align-items: center; min-height: 37px; background: #fbf4e9d9; border-radius: 100px; box-shadow: inset 0 1px 0 #fff9edb3}
.tool-capsule button {display: grid; place-items: center; width: 39px; height: 37px}
.tool-capsule button + button {position: relative}
.tool-capsule button + button::before {content: ""; position: absolute; inset: 10px auto 10px 0; width: 1px; background: #8053332c}
.tool-capsule svg {width: 21px; height: 21px}
.more-dots {width: 3.5px; height: 3.5px; border-radius: 50%; background: currentColor; box-shadow: -6px 0, 6px 0}
.home-menu {
  position: absolute;
  top: calc(100% + 9px);
  right: 0;
  min-width: 145px;
  padding: 4px 9px;
  border: 1px solid #d6b39480;
  border-radius: 13px;
  background: #fbf3e7;
  box-shadow: 0 8px 22px #4c2d2426;
}
.home-menu button {display: flex; align-items: center; gap: 9px; width: 100%; min-height: 43px; padding: 4px 5px; text-align: left; font-size: 13px}
.home-menu button + button {border-top: 1px solid #d9bea46b}
.home-menu svg {width: 17px; height: 17px; color: var(--red)}
.sub-title {text-align: center; font: 650 17px/1.36 var(--serif); text-wrap: balance}
.top-action, .icon-button {min-width: 42px; min-height: 44px; display: inline-grid; place-items: center; position: relative; border-radius: 18px; color: var(--red)}
.top-action:active, .icon-button:active {background-color: #dac2a846}
.bag-count {position: absolute; top: 2px; right: 0; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 9px; background: var(--red); color: #fff7e9; font: 10px/16px var(--sans)}

.home-opening {padding-bottom: clamp(13px,3svh,26px)}
.startup-message {min-height: min(62svh,420px); display: grid; align-content: center; justify-items: center; gap: 10px; padding: 18px; text-align: center; color: var(--muted)}
.startup-message strong {color: var(--red); font: 650 29px/1.3 var(--serif)}
.startup-message p {margin: 0}
.startup-retry {visibility: hidden; animation: startup-retry-visible 0s 7s forwards}
@keyframes startup-retry-visible {to {visibility: visible}}

.home-reel-heading {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  min-height: 48px; padding-bottom: 6px; margin: 0 var(--gutter) 5px;
}
.home-reel-heading h2 {color: #742f1c; font: 700 clamp(22px,6.8vw,29px)/1.25 var(--serif); letter-spacing: .035em}
.home-feature-link {
  display: inline-flex; position: relative; isolation: isolate; align-items: center; justify-content: center; gap: 2px;
  min-height: 44px; padding: 0 7px; white-space: nowrap; color: #74331f; font: 650 13px/1.2 var(--serif);
}
.home-feature-link::before {
  content: ""; position: absolute; z-index: -1; inset: 7px 0; border-radius: 22px;
  background: #fff2ddc9; box-shadow: inset 0 0 0 1px #fff9eaa3;
}
.home-feature-link svg {width: 14px; height: 14px}
.poster-track {
  display: flex; position: relative; gap: 11px; padding: 5px calc((100% - var(--poster-width))/2) 12px;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none; scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain;
}
.poster-track::-webkit-scrollbar {display: none}
.poster-slide {
  position: relative; flex: none; width: var(--poster-width); aspect-ratio: 1055 / 1491;
  border-radius: 14px; overflow: hidden; scroll-snap-align: center;
  background: #47281e; box-shadow: 0 5px 12px #65351e2b;
}
.poster-sheet, .poster-sheet img, .poster-slide video {display: block; width: 100%; height: 100%; object-fit: contain}
.poster-sheet:focus-visible {outline-offset: -4px}
.reel-controls {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin: -2px var(--gutter) 9px;
}
.reel-picker {display: flex; align-items: center; gap: 1px}
.reel-picker button {
  display: grid; place-items: center; position: relative; width: 44px; height: 44px;
  color: #674631; font: 650 16px/1 var(--serif); isolation: isolate;
}
.reel-picker button::before {
  content: ""; position: absolute; inset: 6px 3px; z-index: -1; border-radius: 18px;
  background: #e8cdb09c; border: 1px solid #bc8b5ba1; opacity: 0; transition: opacity .2s;
}
.reel-picker button[aria-pressed="true"] {color: var(--red)}
.reel-picker button[aria-pressed="true"]::before {opacity: 1}
.reel-play {
  display: inline-flex; position: relative; isolation: isolate; align-items: center; justify-content: center; gap: 5px;
  min-height: 44px; min-width: 106px; padding: 0 10px; white-space: nowrap;
  color: #713321; font: 650 13px/1 var(--serif);
}
.reel-play::before {
  content: ""; position: absolute; z-index: -1; inset: 4px 0; border-radius: 24px;
  background: linear-gradient(#fbefdf,#f0dbc0); box-shadow: inset 0 0 0 1px #bf926b83;
}
.reel-play svg {width: 16px; height: 16px}
.primary-button, .outline-button {
  display: inline-flex; justify-content: center; align-items: center; gap: 7px; min-height: 44px;
  border-radius: 30px; padding: 9px 15px; font-weight: 600; color: #fff8ed; text-align: center;
}
.primary-button {background: linear-gradient(169deg, #9c4a38, #792918 80%); box-shadow: inset 0 1px 0 #f2d2ab68, 0 5px 14px #723d221e}
.outline-button {background: #f8eee0; color: var(--red); box-shadow: inset 0 0 0 1px #99704e77}
.primary-button svg, .outline-button svg {width: 18px; height: 18px}
.quick-grid {display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); margin: -2px calc(var(--gutter) - 4px) 0}
.shortcut {
  position: relative; display: grid; place-content: start center; justify-items: center; gap: 5px;
  min-height: 83px; padding: 2px 1px 5px; text-align: center;
  font: 600 clamp(12px, 3.67vw, 16px)/1.35 var(--serif); white-space: nowrap;
}
.shortcut + .shortcut::before {content: ""; position: absolute; top: 33px; height: 27px; left: 0; width: 1px; background: linear-gradient(#b88f5d55,#b88f5d28)}
.seal {position: relative; display: inline-grid; place-items: center; width: clamp(45px, 13.2vw, 57px); aspect-ratio: 1; color: #8e3928}
.seal-shape {position: absolute; inset: 0; width: 100%; height: 100%; fill: #ead5baad; stroke: #b98a55; stroke-width: 1.15}
.seal svg:not(.seal-shape) {z-index: 1; width: 58%; height: 58%; stroke-width: 1.38}

.section-heading {min-height: 49px; display: flex; align-items: center; justify-content: space-between; gap: 7px; margin-bottom: 6px}
.section-heading h2 {font-size: 21px; line-height: 1.3; color: var(--red)}
.section-heading > span, .muted {font-size: 11.5px; color: var(--muted)}
.rule-heading {position: relative; margin-bottom: 13px}
.rule-heading::after {
  content: ""; position: absolute; left: 0; bottom: 2px; width: 117px; height: 1px;
  background: linear-gradient(90deg, #863a26 0 18px, #c0936577 18px, transparent);
}
.text-button {display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 44px; font: 500 13px/1.45 var(--serif); color: #714b33}
.text-button svg {width: 15px; height: 15px}
.tabbar {position: relative; z-index: 3; grid-row: 3; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); height: calc(85px + var(--safe-bottom)); padding: 7px 9px calc(var(--bottom-gap) + var(--safe-bottom))}
.nav-surface {position: absolute; z-index: -1; inset: -7px 0 0; width: 100%; height: calc(100% + 7px); overflow: visible; filter: drop-shadow(0 -4px 9px #866b4610); pointer-events: none}

<script>
(() => {
  'use strict';
  const key = 'jh-mobile-personal-v1';
  const avatars = [['pi','皮'],['ying','影'],['xi','戏']];
  const defaultName = '江汉观众';
  const escape = value => String(value).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  const validAvatar = value => avatars.some(([id])=>id===value);

  function mount({app, read, write, notify, icon, asset, goButton, detail, drafts, bagCount, lastStage, refresh, back}) {
    const nickname = value => typeof value==='string'?Array.from(value.trim()).slice(0,14).join(''):'';
    const routes = (values,limit) => Array.isArray(values)?[...new Set(values.filter(value=>typeof value==='string'&&detail(value)))].slice(0,limit):[];
    function storedProfile() {
      const stored=read(key,{});
      return {name:nickname(stored.name),avatar:validAvatar(stored.avatar)?stored.avatar:'pi',
        favorites:routes(stored.favorites,80),recent:routes(stored.recent,16),
        remember:stored.remember!==false,lessMotion:stored.lessMotion===true};
    }
    const state=storedProfile();
    const avatar = (id, classes='') => '<span class="profile-avatar '+classes+'"><img src="'+asset(id+'.webp')+'" alt=""></span>';
    const name = () => escape(state.name||defaultName);
    const save = (changes,copy='') => {
      Object.assign(state,changes);
      const saved=write(key,{...storedProfile(),...changes});
      if (copy) notify(saved?copy:'本次更改未能保存到设备');
    };

    function track(route) {
      const card=detail(route);
      if (!state.remember||!card) return;
      const recent=[route,...state.recent.filter(path=>detail(path)?.key!==card.key)].slice(0,16);
      if (recent.join('|')!==state.recent.join('|')) save({recent});
    }

    function favoriteButton(route, compact=false) {
      const added=state.favorites.includes(route);
      const label=added?'已收藏':'收藏';
      return '<button type="button" class="profile-favorite'+(compact?' is-compact':'')+'" data-favorite="'+route+'" aria-pressed="'+added+
        '" aria-label="'+(added?'取消收藏':'收藏内容')+'">'+icon('heart')+(compact?'':'<span>'+label+'</span>')+'</button>';
    }

    function refreshFavorite(button, route) {
      const saved=state.favorites.includes(route);
      button.dataset.favorite=route;
      button.setAttribute('aria-pressed',String(saved));
      button.setAttribute('aria-label',saved?'取消收藏':'收藏内容');
      const label=button.querySelector('span');
      if(label) label.textContent=saved?'已收藏':'收藏';
    }

    function stat(target,symbol,title,count) {
      return goButton(target,icon(symbol)+'<strong>'+count+'</strong><span>'+title+'</span>','profile-stat');
    }

    function utility(target,symbol,title,value='') {
      return goButton(target,'<span class="profile-tool-icon">'+icon(symbol)+'</span><span>'+title+'</span>'+
        (value?'<small>'+value+'</small>':'')+'<span class="profile-tool-next">'+icon('next')+'</span>','profile-tool');
    }

    function overview() {
      const saved=drafts(),ongoing=saved.find(item=>!item.complete);
      const next=ongoing||saved[0];
      const destination=next?.route||'make';
      const thumb=next?.image||asset('blank-xi.webp');
      const title=next?.title||'亲手做一件皮影';
      const note=next?(next.complete?'已完成 · 进入作品戏台':'继续制作 · '+next.step):'从选皮开始，做完就能牵杆上台';
      const count=bagCount(),actor=lastStage();
      return '<div class="personal-page">'+
        '<section class="profile-card"><div class="profile-identity">'+avatar(state.avatar)+
        '<div class="profile-name"><h1>'+name()+'</h1><p>本机资料</p></div>'+
        goButton('case/edit',icon('edit')+'<span>编辑资料</span>','profile-edit')+'</div>'+
        '<div class="profile-stats" aria-label="个人收藏和创作">'+
        stat('case/works','knife','我的作品',saved.length)+stat('case/favorites','heart','我的收藏',state.favorites.length)+
        stat('case/recent','history','最近浏览',state.recent.length)+'</div></section>'+
        '<section class="profile-resume" aria-label="继续体验">'+goButton(destination,
        '<img src="'+thumb+'" alt=""><span><strong>'+title+'</strong><small>'+note+'</small></span>'+icon('next'),'profile-resume-link')+'</section>'+
        '<section class="profile-tools" aria-label="常用功能">'+
        utility('shop/bag','bag','购物袋',count?count+' 件':'')+
        (actor?utility('play/solo/'+actor.id,'curtain','继续上次戏台',actor.label+'字'):'')+
        utility('case/settings','settings','体验设置')+
        utility('case/help','book','使用帮助')+'</section></div>';
    }

    function edit() {
      return '<div class="personal-page"><form class="profile-form profile-surface" id="profile-edit">'+
        '<label for="profile-nickname">昵称</label><input id="profile-nickname" name="nickname" type="text" autocomplete="nickname" maxlength="28" placeholder="'+defaultName+'" value="'+
        escape(state.name)+'" aria-describedby="profile-name-note"><small id="profile-name-note">最多 14 个字</small>'+
        '<fieldset class="profile-avatars"><legend>头像</legend><div>'+avatars.map(([id,label])=>
          '<label><input type="radio" name="avatar" value="'+id+'"'+(state.avatar===id?' checked':'')+'>'+
          avatar(id)+'<span>'+label+'</span></label>').join('')+
        '</div></fieldset><button class="primary-button profile-save" type="submit">保存资料</button></form></div>';
    }

    function item(route, removable) {
      const card=detail(route);
      return '<li class="profile-content-item">'+goButton(route,
        '<img src="'+card.image+'" alt="" loading="lazy"><span><strong>'+card.title+'</strong><small>'+card.note+'</small></span>'+icon('next'),'profile-content-link')+
        (removable?'<button type="button" class="profile-remove" data-favorite="'+route+'" aria-pressed="true" aria-label="取消收藏 '+escape(card.title)+'">'+icon('heart')+'</button>':'')+'</li>';
    }

    function list(kind) {
      const favorite=kind==='favorites',items=favorite?state.favorites:state.recent;
      const symbol=favorite?'heart':'history';
      const empty=favorite?'还没有收藏':'还没有浏览记录';
      const hint=favorite?'看海报、影片或文创时，点收藏就能在这里找到。':
        (state.remember?'看过的海报、影片和文创会出现在这里。':'浏览记录已关闭，可以在设置中重新开启。');
      return '<div class="personal-page personal-detail">'+(items.length?
        '<div class="profile-list-head"><span>'+items.length+' 条</span>'+
        (favorite?'':'<button type="button" class="text-button" data-profile-clear>清空记录</button>')+'</div>'+
        '<ul class="profile-content-list">'+items.map(route=>item(route,favorite)).join('')+'</ul>':
        '<section class="profile-empty profile-surface">'+icon(symbol)+'<h1>'+empty+'</h1><p>'+hint+'</p>'+
        goButton(!favorite&&!state.remember?'case/settings':'stage/gallery',!favorite&&!state.remember?'打开设置':'去看海报与影像 '+icon('next'),'outline-button')+'</section>')+
        (!favorite&&items.length?'<dialog class="profile-confirm" aria-labelledby="clear-title"><h2 id="clear-title">清空浏览记录？</h2>'+
        '<p>将删除当前设备上的全部浏览记录。</p><div><button type="button" class="outline-button" data-profile-cancel>取消</button>'+
        '<button type="button" class="primary-button" data-profile-confirm>清空记录</button></div></dialog>':'')+'</div>';
    }

    function switchRow(key,title,note) {
      return '<label class="profile-setting"><span><strong>'+title+'</strong><small>'+note+'</small></span>'+
        '<input type="checkbox" data-profile-setting="'+key+'" '+(state[key]?'checked':'')+'><span class="profile-switch" aria-hidden="true"></span></label>';
    }

    function settings() {
      return '<div class="personal-page personal-detail"><section class="profile-surface profile-settings" aria-label="体验偏好">'+
        switchRow('lessMotion','简化界面动效','减少页面切换和按钮动效')+
        switchRow('remember','记住浏览记录','关闭后停止添加新的记录')+'</section>'+
        '<section class="profile-tools" aria-label="记录管理">'+utility('case/recent','history','管理浏览记录',state.recent.length+' 条')+
        utility('case/edit','profile','编辑个人资料')+'</section>'+
        '<p class="profile-data-note">昵称、头像、收藏、记录和制作进度保存在当前设备的浏览器里。</p></div>';
    }

    function help() {
      return '<div class="personal-page personal-detail"><section class="profile-tools profile-help">'+
        '<details open><summary>从哪里开始或继续制作？</summary><p>点底栏的「亲手制作」即可开始。做到一半，可以在制作首页继续，也可以在「我的作品」选择之前的字影。</p>'+
        goButton('case/works','打开我的作品 '+icon('next'),'text-button')+'</details>'+
        '<details><summary>如何用镜头牵杆？</summary><p>在戏台里点「镜头操纵」，允许摄像头权限。用拇指和食指捏合握杆，张开即松手。手机浏览器需要通过 HTTPS 打开镜头。</p>'+
        goButton('play','进入戏台 '+icon('next'),'text-button')+'</details>'+
        '<details><summary>收藏和浏览记录有什么用？</summary><p>在海报、影片或文创详情里点心形按钮，可以在「我的收藏」重新打开。浏览记录保存最近打开的内容，可以清空或关闭。</p></details>'+
        '<details><summary>怎样恢复以前的作品？</summary><p>在「我的作品」点「导入制作稿」，选择之前导出的制作稿文件。在戏台菜单中可以导出制作稿。</p>'+
        goButton('make/import','导入制作稿 '+icon('next'),'text-button')+'</details>'+
        '<details><summary>购物袋可以下单吗？</summary><p>可以把喜欢的款式加入购物袋。文创目前用于设计展示。</p></details>'+
        '</section></div>';
    }

    function action(button, page) {
      const target=button.dataset.favorite;
      if (target&&detail(target)) {
        const had=state.favorites.includes(target);
        const favorites=had?state.favorites.filter(route=>route!==target):[target,...state.favorites];
        save({favorites},had?'已取消收藏':'已加入我的收藏');
        if (page==='case/favorites') {
          refresh();
          app.querySelector('.profile-content-list button,.profile-empty button')?.focus({preventScroll:true});
        } else {
          app.querySelectorAll('[data-favorite]').forEach(node=>{
            if(node.dataset.favorite===target) refreshFavorite(node,target);
          });
        }
        return true;
      }
      if (button.hasAttribute('data-profile-clear')) {
        app.querySelector('.profile-confirm')?.showModal();
        return true;
      }
      if (button.hasAttribute('data-profile-cancel')) {
        button.closest('dialog')?.close();
        return true;
      }
      if (button.hasAttribute('data-profile-confirm')) {
        button.closest('dialog')?.close();
        save({recent:[]},'已清空浏览记录');
        refresh();
        app.querySelector('.profile-empty button')?.focus({preventScroll:true});
        return true;
      }
      return false;
    }

    function applyMotion() {
      app.classList.toggle('reduce-interface-motion',state.lessMotion);
    }
    applyMotion();
    window.addEventListener('storage',event=>{
      if(event.key===key||event.key===null){
        Object.assign(state,storedProfile());
        applyMotion();
      }
    });
    app.addEventListener('change',event=>{
      const setting=event.target.dataset.profileSetting;
      if (!['remember','lessMotion'].includes(setting)) return;
      save({[setting]:event.target.checked},'设置已更新');
      applyMotion();
    });
    app.addEventListener('submit',event=>{
      if (event.target.id!=='profile-edit') return;
      event.preventDefault();
      const form=new FormData(event.target);
      const selected=form.get('avatar');
      save({name:nickname(form.get('nickname')),avatar:validAvatar(selected)?selected:state.avatar},'个人资料已保存');
      back();
    });

    return {
      overview,edit,settings,help,list,action,track,favoriteButton,refreshFavorite,
      lessMotion:()=>state.lessMotion
    };
  }

  window.ShadowPersonal={mount};
})();

</script>

  const write = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch { return false; }
  };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');

  const artwork = (id) => data.posters.find(item => item[0] === id);
  const filmFor = (id) => data.films.find(item => item[0] === id);

    const [image,title] = artwork('poster-'+id);

  let activePoster = homePosters[0].id, homeVideo, finishedPoster;

  const posterPosition = () => (homePosters.findIndex(poster=>poster.id===activePoster)+1)+' / '+homePosters.length;
  const posterLabel = (id,label) => id===activePoster?'播放'+label+'字动态海报':'查看'+label+'字海报';

  function updatePosterAction() {
    const button = view.querySelector('[data-poster-play]');

    const playing = homeVideo && !homeVideo.paused;
    const [symbol,label] = playing ? ['pause','暂停播放'] : homeVideo ? ['play','继续播放'] :
      finishedPoster===activePoster ? ['history','重播动态'] : ['play','播放动态'];
    if (button.textContent!==label) button.innerHTML = icon(symbol)+'<span>'+label+'</span>';
  }

  function stopHomeVideo() {
    if (!homeVideo) return;
    const video = homeVideo;
    homeVideo = null;
    const slide = video.parentElement;
    video.pause();
    video.removeAttribute('src');
    video.load();
    video.remove();
    slide?.querySelector('[data-reel-close]')?.remove();
    slide?.querySelector('.poster-sheet').removeAttribute('hidden');
    updatePosterAction();
  }

  function setActivePoster(id) {
    if (id===activePoster) return;
    stopHomeVideo();
    activePoster = id;
    view.querySelector('.reel-position').value = posterPosition();
    view.querySelectorAll('[data-poster]').forEach(slide=>{
      const poster=slide.dataset.poster;
      slide.toggleAttribute('data-current',poster===id);
      slide.querySelector('.poster-sheet').setAttribute('aria-label',posterLabel(poster,glyphs[poster].label));
    });
    const favorite=view.querySelector('.reel-actions [data-favorite]');
    if (favorite) personal.refreshFavorite(favorite,'stage/poster/poster-'+id);
    view.querySelectorAll('[data-poster-tab]').forEach(button=>
      button.setAttribute('aria-pressed',String(button.dataset.posterTab===id)));
    updatePosterAction();
  }

  function movePoster(track, id, smooth) {
    const slide = track.querySelector('[data-poster="'+id+'"]');
    if (!slide) return;
    const left = slide.offsetLeft+(slide.offsetWidth-track.clientWidth)/2;
    const moving = smooth&&!reduceInterface();
    track.dataset.snapTarget = moving&&Math.abs(track.scrollLeft-left)>2 ? id : '';
    setActivePoster(id);
    track.scrollTo({left,behavior:moving?'smooth':'instant'});
  }

  function connectHomeImages() {
    const images=[...content.querySelectorAll('[data-home-src]')];
    const start=image=>{
      image.src=image.dataset.homeSrc;
      delete image.dataset.homeSrc;
    };
    if (!('IntersectionObserver' in window)) {
      for (const image of images) {
        image.loading='lazy';
        start(image);
      }
      return;
    }
    homeMediaObserver=new IntersectionObserver((entries,observer)=>{
      for (const entry of entries) {
        if (entry.intersectionRatio<.22) continue;
        observer.unobserve(entry.target);
        start(entry.target);
      }
    },{root:view,rootMargin:'0px 0px 80px',threshold:.22});
    for (const image of images) homeMediaObserver.observe(image);
  }

  function connectPosterTrack() {
    const track = view.querySelector('.poster-track');
    const slides = [...track.children];
    let pending = false;
    movePoster(track,activePoster,false);
    const interrupt = () => { track.dataset.snapTarget = ''; };
    track.addEventListener('pointerdown',interrupt,{passive:true});
    track.addEventListener('wheel',interrupt,{passive:true});
    track.addEventListener('scroll',()=>{
      if (pending) return;
      pending = true;
      requestAnimationFrame(()=>{
        pending = false;
        if (!track.isConnected) return;
        const center = track.scrollLeft+track.clientWidth/2;
        const distance = slide=>Math.abs(slide.offsetLeft+slide.offsetWidth/2-center);
        const nearest = slides.reduce((a,b)=>distance(a)<=distance(b)?a:b);
        const id = nearest.dataset.poster;
        if (track.dataset.snapTarget&&track.dataset.snapTarget!==id) return;
        interrupt();
        setActivePoster(id);
      });
    },{passive:true});
  }

  function playHomeVideo(id) {
    const item = homePosters.find(p=>p.id===id);
    const track = view.querySelector('.poster-track');
    if (!item||!track) return;
    if (id!==activePoster) { movePoster(track,id,true); return; }
    stopHomeVideo();
    const slide = track.querySelector('[data-poster="'+id+'"]');
    const sheet = slide.querySelector('.poster-sheet');
    const video = document.createElement('video');
    homeVideo = video;
    video.controls = true;
    video.playsInline = true;
    video.preload = 'metadata';
    video.poster = asset(item.image+'-preview.webp');
    video.setAttribute('aria-label',item.label+'字动态海报');
    video.addEventListener('play',()=>personal.track('stage/watch/'+item.film),{once:true});
    video.addEventListener('play',updatePosterAction);
    video.addEventListener('pause',updatePosterAction);
    video.addEventListener('ended',()=>{
      if (homeVideo!==video) return;
      finishedPoster=id;
      stopHomeVideo();
    });
    video.addEventListener('error',()=>{
      if (homeVideo!==video) return;
      stopHomeVideo();
      notify('视频暂时无法播放');
    });
    const hadFocus = document.activeElement===sheet;
    sheet.hidden = true;
    slide.append(video);
    slide.insertAdjacentHTML('beforeend','<button type="button" class="reel-close craft-back" data-reel-close aria-label="返回静态海报">'+icon('close')+'</button>');

  function productPicture(file,label='',size='card') {
    const media=data.productImages?.[file], original=asset(file);

    return '<img src="'+media.preview+'" data-product-src="'+asset(media[size])+

  async function loadProductPicture(image) {
    const target=image.dataset.productSrc;
    if (!target||image.getAttribute('src')===target) return true;
    const decoded=new Image();
    decoded.decoding='async';
    decoded.src=target;
    try {
      await decoded.decode();
      if (!image.isConnected||image.dataset.productSrc!==target) return false;
      image.src=target;
      return true;
    } catch {
      return false;
    }
  }

  function connectProductImages() {
    productMediaObserver?.disconnect();
    const images=[...content.querySelectorAll('[data-product-src]')];
    if (!('IntersectionObserver' in window)) {
      for (const image of images) loadProductPicture(image);
      return;
    }
    productMediaObserver=new IntersectionObserver((entries,observer)=>{
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        observer.unobserve(entry.target);
        loadProductPicture(entry.target);
      }
    },{root:view,rootMargin:'0px 0px 70px',threshold:.01});
    for (const image of images) productMediaObserver.observe(image);
  }

  async function loadProductOriginal() {
    const image=$('#media-content img');
    if (!image?.dataset.productOriginal) return;
    const status=$('#product-media-status'), retry=$('#product-media-retry');
    status.textContent='正在加载清晰大图';
    retry.hidden=true;
    image.dataset.productSrc=image.dataset.productOriginal;
    const loaded=await loadProductPicture(image);
    if (!image.isConnected) return;
    status.textContent=loaded?'':'清晰大图暂未加载';
    retry.hidden=loaded;
  }

    const page=button.closest('.product-page');
    const item=itemFor(page.dataset.product);

  function validRoute(input) {
    if (typeof input!=='string') return 'stage';
    if (input==='play/show') return threeFilm;
    if (input==='stage/guide') return 'make';
    if (input==='make/works') return 'case/works';
    if (Object.hasOwn(pages,input)||personalContent(input)) return input;
    const parts=input.split('/'),[tab,sub,id,variant]=parts;
    if(tab==='play'&&glyphs[id]){
      if(sub==='camera'&&parts.length===3) return input;
      if(sub==='camera'&&parts.length===4&&variant==='work') return drafts[id]==='perform'?input:'play/camera/'+id;
      if(sub==='work'&&parts.length===3) return drafts[id]==='perform'?input:'case/works';
    }
    if(tab==='make'&&sub==='work'&&glyphs[id]&&(parts.length===3||parts.length===4&&variant==='start')) return 'make/work/'+id;
    if(tab==='shop'&&sub==='object'&&parts.length===3&&itemFor('magnet').models?.includes(id)) return input;
    return 'stage';
  }

  function parentFor(next) {
    const [tab,sub,id]=next.split('/');
    if (pages[next]?.parent) return pages[next].parent;
    if (!sub) return 'stage';
    if (tab==='stage') return 'stage/gallery';
    if (tab==='play'&&sub==='solo') return 'play/characters';
    if (tab==='play'&&sub==='work') return 'case/works';
    if (tab==='shop'&&sub==='object') return 'shop/item/magnet/'+id;
    return tab;
  }

  function frameFor(next) {
    const [tab,sub,id,variant] = next.split('/');
    if (tab==='play') {
      if (!sub) return {url:'maker.html?mode=stage&glyph=xi',title:'互动戏台',stageRoom:true};
      if (sub==='solo') return {url:'maker.html?mode=stage&glyph='+id,title:'「'+glyphs[id].label+'」字戏台',stageRoom:true};
      if (sub==='work') return {url:'maker.html?mode=stage&work=1&glyph='+id,title:'「'+glyphs[id].label+'」字作品戏台',stageRoom:true};
      if (sub==='touch') return {url:'stage.html?mode=touch&experience=1#puppeteer',title:'触屏操偶'};
      if (sub==='camera') return {url:'maker.html?mode=stage&camera=1&glyph='+(id||'xi')+(variant==='work'?'&work=1':''),title:'镜头操纵',camera:true,stageRoom:true};
    }
    if (tab==='make'&&sub==='work') return {url:'maker.html?slot='+glyphs[id].slot,title:'制作「'+glyphs[id].label+'」'};
    if (tab==='make'&&sub==='import') return {url:'maker.html?mode=import',title:'导入制作稿'};
    if (tab==='shop'&&sub==='object') return {url:'object.html?model='+id,title:'「'+glyphs[id].label+'」字 · 立体赏物'};
    return null;
  }

  function titleFor(next, embedded) {
    if (embedded) return embedded.title;
    const [,sub,id] = next.split('/');
    if (sub==='watch'&&id==='film-three') return '一幕三字';
    return pages[next]?.title||personalContent(next)?.title||'江汉皮影戏';
  }

        (route==='make'?goButton('case/works',Craft.icon('works')+'<span>我的作品</span>','craft-works-button'):'<span></span>');

  function sendFrameSettings(target) {
    target.contentWindow?.postMessage({app:'jianghan-mobile',type:'interface-options',lessMotion:personal.lessMotion()},
      location.protocol==='file'?'*':location.origin);
  }

  function showStage(visible) {
    if (!stageFrame||stageFrame.hidden===!visible) return;
    stageFrame.hidden = !visible;
    stageFrame.contentWindow.postMessage({app:'jianghan-mobile',type:'stage-visibility',visible},
      location.protocol==='file:'?'*':location.origin);
    if (visible) sendFrameSettings(stageFrame);
  }

  function showFrameRetry(message) {
    const loading = $('#frame-loading');
    if (loading) loading.innerHTML = '<p>'+message+'</p><button type="button" class="outline-button" id="reload-frame">重新打开</button>';
  }

  function mountFrame(config, keepStage) {
    if (keepStage&&stageFrame) {
      frame = stageFrame;
      showStage(true);
    } else {
      frame = document.createElement('iframe');
      frame.title = config.title;
      if (config.camera) frame.allow = "camera 'self'; autoplay 'self'; fullscreen 'self'";
      frame.className = 'experience';
      const frameUrl=new URL('experience/'+config.url,location.href);
      frameUrl.searchParams.set("v","a54e378c9c");
      frame.src=frameUrl.href;
      if (keepStage) {
        stageFrame = frame;
        view.prepend(frame);
      } else content.prepend(frame);
    }
    if (frame.classList.contains('ready')) return;
    content.insertAdjacentHTML('beforeend','<div id="frame-loading" class="frame-loading" role="status"><span>'+icon('mark')+'</span><p>正在展开灯幕</p></div>');
    frameTimer = setTimeout(()=>showFrameRetry('网络较慢，仍在加载'),14000);
  }

  function animatePage(previous,next) {
    pageMotion?.cancel();
    if (reduceInterface()||!previous||previous===next) return;
    const from = tabs.findIndex(([id])=>id===previous);
    const to = tabs.findIndex(([id])=>id===next);
    const shift = from>=0&&to>=0 ? (to>from?'5px 0':'-5px 0') : '0 3px';
    pageMotion = view.animate([{opacity:.92,translate:shift},{opacity:1,translate:'0 0'}],
      {duration:185,easing:'cubic-bezier(.2,.75,.22,1)'});
  }

  function render(next, restore = false) {
    const previous = route;
    if (route) scrollPositions.set(route, view.scrollTop);
    route = next;
    personal.track(next);
    frame = null;
    clearTimeout(frameTimer);
    homeMediaObserver?.disconnect();
    homeMediaObserver=null;
    productMediaObserver?.disconnect();
    productMediaObserver=null;
    stopHomeVideo();
    if (next!=='play') showStage(false);
    content.replaceChildren();
    const [tab,sub,id,variant] = next.split('/');
    const tabIndex = tabs.findIndex(([id])=>id===next);
    const deep = tabIndex<0, embedded = frameFor(next);
    app.classList.toggle('is-home',next==='stage');
    app.classList.toggle('is-explore',tab==='explore');
    app.classList.toggle('is-shop',tab==='shop');
    app.classList.toggle('is-account',tab==='case');
    app.classList.remove('home-scrolled');
    const craftPage=(tab==='make'&&sub!=='import')||Boolean(embedded?.stageRoom);
    app.classList.toggle('craft-flow',craftPage);
    app.classList.toggle('craft-work',craftPage&&Boolean(embedded));
    app.classList.toggle('in-detail', deep);
    app.classList.toggle('in-experience', Boolean(embedded));
    tabbar.hidden = deep;
    if (!deep) {
      tabbar.classList.toggle('stage-selected',tab==='play');
      tabbar.style.setProperty('--tab-index',tabIndex);
    }
    tabbar.querySelectorAll('[data-go]').forEach(b=>{
      if (b.dataset.go===tab) b.setAttribute('aria-current','page');
      else b.removeAttribute('aria-current');
    });
    const title = titleFor(next,embedded);
    document.title = deep?title+' · 江汉皮影戏':'江汉皮影戏';
    updateHeader(deep,title,tab);

    if (embedded) {
      if (sub==='solo') {
        lastGlyph = id;
        write('jh-mobile-recent', id);
      }
      mountFrame(embedded,next==='play');
      animatePage(previous,next);
      return;
    }

    const show=pages[next]?.view;
    if (show) content.innerHTML=show();
    else if (tab==='shop') content.innerHTML=product(id,variant);
    else if (sub==='watch') content.innerHTML=watch(id);
    else if (sub==='poster') content.innerHTML=poster(id);
    if (next==='stage') {
      connectPosterTrack();
      connectHomeImages();
    }
    view.scrollTop = restore?(scrollPositions.get(next)||0):0;
    if (tab==='shop') connectProductImages();
    animatePage(previous,next);
  }

  function isCraftStep(next) {
    return next==='make/choose'||Boolean(next?.startsWith('make/work/'));
  }

  function previousPage() {
    const state=history.state;
    return state?.jianghan&&state.page===route&&state.previous!==route&&validRoute(state.previous)===state.previous
      ?state.previous:null;
  }

  function go(input, options = {}) {
    const next=validRoute(input);
    app.querySelector('dialog[open]')?.close();
    if (next===route&&!options.refresh) { view.scrollTo({top:0,behavior:reduceInterface()?'auto':'smooth'}); return; }
    if (next==='make/choose') makerChoice=glyphs[options.pick]?.id||null;
    const replace=options.replace||isCraftStep(route)&&isCraftStep(next);
    const previous=replace?previousPage():route;
    (replace?history.replaceState:history.pushState).call(history,{jianghan:true,page:next,previous},'','#'+next);
    render(next,options.restore);
    if (options.play&&next.startsWith('stage/watch/')) view.querySelector('video')?.play().catch(()=>{});
  }

  function back() {
    const dialog=app.querySelector('dialog[open]');
    if (dialog) { dialog.close(); return; }
    if (previousPage()) { history.back(); return; }
    go(parentFor(route),{replace:true,restore:true});
  }

  function updateBasket(key, change) {
    const [id,variant] = key.split('/'), item = itemFor(id);
    if (!item||variant!==variantFor(item,variant)) return;
    const count = Math.min(99,Math.max(0,change===null?0:(basket[key]||0)+change));
    if (count) basket[key] = count;
    else delete basket[key];
    write('jh-mobile-basket',basket);
    if (route==='shop/bag') render(route,true);
    else updateHeader(true,titleFor(route),'shop');
  }

  function toggleMenu() {
    const menu = $('#home-menu');
    if (!menu) return;
    const expanded = menu.hidden;
    menu.hidden = !expanded;
    $('#home-menu-toggle').setAttribute('aria-expanded',String(expanded));
  }

  app.addEventListener('pointerdown',event=>{
    const menu = $('#home-menu');
    if (menu && !menu.hidden && !event.target.closest('.home-tools')) toggleMenu();
  });
  app.addEventListener('keydown',event=>{
    const menu = $('#home-menu');
    if (event.key==='Escape' && menu && !menu.hidden) {
      toggleMenu();
      $('#home-menu-toggle').focus();
    }
  });
  view.addEventListener('scroll',()=>{
    if (route==='stage') app.classList.toggle('home-scrolled',view.scrollTop>20);
  },{passive:true});

  app.addEventListener('click', event=>{
    const button = event.target.closest('button');
    if (!button||button.disabled) return;
    const d = button.dataset;
    if (button.matches('[data-back]')) back();
    else if (personal.action(button,route)) return;
    else if (button.matches('[data-menu]')) toggleMenu();
    else if (d.go) go(d.go,{restore:d.go!=='make'&&button.matches('.nav-tab'),play:true});
    else if (d.replace) go(d.replace,{replace:true});
    else if (d.posterTab) movePoster(view.querySelector('.poster-track'),d.posterTab,true);
    else if (d.reelPlay) playHomeVideo(d.reelPlay);
    else if (button.hasAttribute('data-reel-close')) {
      stopHomeVideo();
      view.querySelector('[data-reel-play="'+activePoster+'"]')?.focus({preventScroll:true});
    }
    else if (button.hasAttribute('data-poster-play')) {
      if (homeVideo?.paused) homeVideo.play().catch(()=>{});
      else if (homeVideo) homeVideo.pause();
      else playHomeVideo(activePoster);
    } else if (d.craftPick) {
      makerChoice=d.craftPick;
      const scroll=view.scrollTop;
      content.innerHTML=chooseCraft();
      view.scrollTop=scroll;
      view.querySelector('[data-craft-pick="'+makerChoice+'"]').focus({preventScroll:true});
    } else if (d.category) {
      category = d.category;
      const y = view.scrollTop;
      content.innerHTML = shop();
      view.scrollTop = y;
      view.querySelector('[data-category="'+category+'"]')?.focus({preventScroll:true});
      connectProductImages();
    } else if (d.productShot) selectProductShot(button);
    else if (d.add) {
      updateBasket(d.add,1);
      notify('已加入购物袋');
    } else if (d.quantity) updateBasket(d.quantity,Number(d.delta));
    else if (d.remove) updateBasket(d.remove,null);
    else if (d.photoGroup) selectPhotoGroup(d.photoGroup);
    else if (d.photo) openPhoto(d.photo);
    else if (d.photoStep && photoView) showPhoto(Number(d.photoStep));
    else if (button.hasAttribute('data-media-zoom')) zoomMedia(button.getAttribute('aria-pressed')!=='true');
    else if (button.id==='product-media-retry') loadProductOriginal();
    else if (button.hasAttribute('data-enlarge')) {
      const image=button.querySelector('img').cloneNode();
      image.draggable=false;
      $('#media-title').textContent=image.alt;
      $('#media-content').innerHTML='<div class="media-viewport" aria-label="商品图片"></div>'+
        '<div class="product-image-tools"><span id="product-media-status" role="status"></span>'+
        '<button type="button" class="outline-button" id="product-media-retry" hidden>重新加载大图</button>'+mediaZoomButton+'</div>';
      $('#media-content .media-viewport').append(image);
      $('#media-dialog').showModal();
      loadProductOriginal();
    } else if (button.id==='close-media') $('#media-dialog').close();
    else if (button.id==='reload-frame') {
      if (route==='play') { stageFrame?.remove(); stageFrame = null; }
      render(route);
    }
  });

  const mediaDialog = $('#media-dialog');
  const mediaZoomButton='<button type="button" class="outline-button media-zoom" data-media-zoom aria-pressed="false">'+Craft.icon('zoom')+'<span>放大细节</span></button>';
  let mediaPointer;
  function zoomMedia(zoom) {
    const viewport = mediaDialog.querySelector('.media-viewport'), button = mediaDialog.querySelector('[data-media-zoom]');
    const img = viewport.querySelector('img');
    if (zoom&&!img.naturalWidth) return;
    if (zoom) {
      const {width,height} = img.getBoundingClientRect();
      img.style.width = (width*2)+'px';
      img.style.height = (height*2)+'px';
    } else img.removeAttribute('style');
    viewport.classList.toggle('zoomed',zoom);
    viewport.tabIndex = zoom?0:-1;
    viewport.scrollLeft = zoom?(viewport.scrollWidth-viewport.clientWidth)/2:0;
    viewport.scrollTop = zoom?(viewport.scrollHeight-viewport.clientHeight)/2:0;
    button.setAttribute('aria-pressed',String(zoom));
    button.querySelector('span').textContent = zoom?'恢复全图':'放大细节';
  }
  mediaDialog.addEventListener('close',()=>{
    photoView = null;
    mediaPointer = null;
    mediaDialog.classList.remove('photo-dialog');
    mediaDialog.setAttribute('aria-label','作品预览');
    $('#media-content').replaceChildren();
  });
  mediaDialog.addEventListener('keydown',event=>{
    if (!photoView||event.target.closest('.media-viewport.zoomed')||!['ArrowLeft','ArrowRight'].includes(event.key)) return;
    event.preventDefault();
    showPhoto(event.key==='ArrowLeft'?-1:1);
  });
  mediaDialog.addEventListener('pointerdown',event=>{
    const viewport = event.target.closest('.media-viewport');
    if (!viewport||!event.isPrimary||event.button!==0) return;
    const zoomed=viewport.classList.contains('zoomed');
    const pan=zoomed&&event.pointerType==='mouse';
    if (!pan&&!(photoView&&!zoomed&&event.pointerType==='touch')) return;
    mediaPointer = {viewport,pan,x:event.clientX,y:event.clientY,id:event.pointerId,left:viewport.scrollLeft,top:viewport.scrollTop};
    if(pan) viewport.setPointerCapture(event.pointerId);
  });
  mediaDialog.addEventListener('pointermove',event=>{
    if (!mediaPointer?.pan||event.pointerId!==mediaPointer.id) return;
    const {viewport,left,top,x,y} = mediaPointer;
    viewport.scrollLeft = left+x-event.clientX;
    viewport.scrollTop = top+y-event.clientY;
  });
  mediaDialog.addEventListener('pointerup',event=>{
    if (!mediaPointer||event.pointerId!==mediaPointer.id) return;
    const {pan,x,y} = mediaPointer;
    mediaPointer = null;
    const dx = event.clientX-x, dy = event.clientY-y;
    if (!pan&&photoView&&Math.abs(dx)>46&&Math.abs(dx)>Math.abs(dy)*1.5) showPhoto(dx<0?1:-1);
  });
  mediaDialog.addEventListener('pointercancel',()=>{mediaPointer=null;});

  window.addEventListener('message', event=>{
    if (location.protocol!=='file:'&&event.origin!==location.origin) return;
    const message = event.data;
    if (message?.app!=='jianghan-mobile') return;
    const current = frame&&event.source===frame.contentWindow;
    if (message.type==='ready') {
      if (current) {
        clearTimeout(frameTimer);
        $('#frame-loading')?.remove();
        frame.classList.add('ready');
        sendFrameSettings(frame);
      } else if (stageFrame&&event.source===stageFrame.contentWindow) stageFrame.classList.add('ready');
      return;
    }
    if (!current) return;
    if (message.type==='load-error') {
      clearTimeout(frameTimer);
      showFrameRetry('页面暂未加载完成，请重试');
    } else if (message.type==='back') back();
    else if (message.type==='craft-exit'&&route.startsWith('make/')) back();
    else if (message.type==='craft-choose'&&route.startsWith('make/work/')) {
      go('make/choose',{replace:true,pick:route.split('/')[2]});
    }
    else if (message.type==='draft'&&glyphs[message.glyph]&&Object.hasOwn(stepNames,message.step)) {
      delete drafts[message.glyph];
      drafts[message.glyph] = message.step;
      write('jh-mobile-drafts',drafts);
    } else if (message.type==='make') {
      if (glyphs[message.glyph]) go('make/choose',{pick:message.glyph});
      else go('make');
    } else if (message.type==='work-stage'&&route.startsWith('make/work/')&&
      route.split('/')[2]===message.glyph&&drafts[message.glyph]==='perform') {
      go('play/work/'+message.glyph,{replace:true});
    }
    else if (message.type==='works') go('case/works');
    else if (message.type==='home') go('stage');
    else if (message.type==='stage-link') {
      const target={film:threeFilm,camera:'play/camera',touch:'play/touch',characters:'play/characters'}[message.target];
      if (target) go(target,{play:true});
    } else if (message.type==='cast'&&glyphs[message.glyph]) {
      lastGlyph=message.glyph;
      write('jh-mobile-recent',lastGlyph);
      personal.track('play/solo/'+lastGlyph);
    }
    else if (message.type==='camera') {
      const glyph = glyphs[message.glyph]?message.glyph:null;
      go(glyph?'play/camera/'+glyph+(message.work?'/work':''):'play/camera');
    } else if (message.type==='touch-return'&&route.startsWith('play/camera')) {
      const previous=previousPage(), [, ,lensGlyph='xi',variant]=route.split('/');
      if (message.glyph===lensGlyph&&message.work===(variant==='work')&&previous&&
        /^(play(?:\/(?:solo|work)\/\w+)?|make\/work\/\w+)$/.test(previous)) back();
      else {
        const id=glyphs[message.glyph]?.id||lensGlyph;
        go((message.work&&drafts[id]==='perform'?'play/work/':'play/solo/')+id,{replace:true});
      }
    }
  });
  function syncHistory() {
    const requested=location.hash.slice(1),next=validRoute(requested),current=history.state;
    if (requested!==next||current?.page!==next) {
      const previous=current?.jianghan&&(!current.page||current.page===requested)&&validRoute(current.previous)===current.previous
        ?current.previous:null;
      history.replaceState({jianghan:true,page:next,previous},'','#'+next);
    }
    if (next!==route) {
      app.querySelector('dialog[open]')?.close();
      render(next,true);
    }
  }
  window.addEventListener('popstate',syncHistory);
  window.addEventListener('hashchange',syncHistory);
  syncHistory();
})();

</script>
</body>
</html>
